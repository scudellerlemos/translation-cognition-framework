# Tests — verificação funcional do harness em cada push/PR (7 jobs paralelos, sem
# dependência entre si — cada um roda em runner própria e falha aparece nomeada no PR).
#   env-guard          : .env nunca rastreado pelo git
#   mypy                : type-check do núcleo já tipado
#   coverage            : testes de runtime/validation/db/skills com piso de 90% (matrix 3.11/3.12)
#   connector-bof4      : contrato round-trip do conector BoF4
#   connector-uta       : contrato round-trip do conector Utawarerumono
#   connector-souldiers : contrato round-trip do conector Souldiers
#   connector-skeleton  : contrato do template de conector
#   connector-io        : utilitários compartilhados entre conectores (framework/connectors/*.py)
#   merge-gate          : aprovação manual (environment production) antes do merge em main
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # S5: .env nunca deve ser rastreado pelo git (evita vazamento de credenciais no repo).
  # Não precisa de Python — só git, então roda isolado e rápido.
  env-guard:
    name: Guard — .env não rastreado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERRO: .env rastreado — remova com: git rm --cached .env"
            exit 1
          fi
          echo "OK: .env não rastreado"

  # Type-check restrito ao núcleo já tipado (ampliar em lotes pequenos). Roda numa única
  # versão de Python — comportamento de mypy não varia entre 3.11/3.12 aqui.
  mypy:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Type-check (mypy)
        run: mypy --follow-imports=silent framework/text_ids.py framework/runtime/config.py framework/runtime/paths.py framework/runtime/cost.py framework/runtime/context_pack.py framework/runtime/state_index.py framework/db/store.py framework/db/migrate_from_flat.py framework/db/export_to_flat.py framework/runtime/model.py framework/runtime/run_scene.py framework/runtime/run_chapter.py framework/runtime/run_game.py framework/runtime/back_translate.py framework/runtime/llm_client.py framework/skills/registry.py framework/skills/s00_extraction.py framework/skills/s06_translation.py framework/skills/s07_qa.py framework/skills/s08_reinsertion.py framework/skills/skill_base.py

  # E3: piso de cobertura da APLICAÇÃO inteira (framework = runtime + db + skills + validation +
  # cli). Um único passo roda toda a suíte do framework sob coverage e exige 90% da LÓGICA — o
  # omit/exclude de dev-tools/clientes de rede/stack de ML/CLI mains fica no setup.cfg
  # ([coverage:*]). Também cobre o contrato de migração (silent-zero) e o e2e das skills.
  # --cov aponta só p/ os pacotes que este job testa: framework/connectors/ tem gate proprio
  # (job "Connector shared utilities", piso 75%) -- medir aqui tambem so puniria os 90% com
  # codigo que este job nunca executa (so importado de passagem por model.py/split_scenes.py).
  # Paralelizado pela matriz de versões de Python (2 runners).
  coverage:
    name: Coverage — runtime + db + skills + validation (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run framework tests with coverage (90%)
        run: |
          python -m pytest framework/runtime/ framework/validation/ framework/db/ framework/skills/ \
            -v --tb=short --cov=framework/runtime --cov=framework/validation --cov=framework/db \
            --cov=framework/skills --cov=framework/cli.py --cov-report=term-missing --cov-fail-under=90

  # Contrato do conector (round-trip byte-idêntico = oráculo). Jobs SEPARADOS por projeto:
  # test_roundtrip.py tem basename repetido entre bof4/uta e colidiria numa coleta única.
  # Sem o binário/bundle do jogo (gitignored), os testes que o exigem fazem pytest.skip;
  # codec/schema/governança rodam sempre. BoF4 e Utawarerumono já fecham a lacuna: cada um tem
  # test_roundtrip_synthetic.py, que constrói o container binário sintético em memória (TOC+
  # ponteiros no BoF4; Filename+Pack+scripts STSC no Uta) e roda o oráculo completo (extract->
  # reinsert->re-extract byte-idêntico) SEMPRE, sem precisar do arquivo comercial. Souldiers usa
  # bundles Unity (UnityPy só LÊ, não constrói do zero — fixture sintética de container não é
  # viável); o teste sempre-ativo ali cobre só a lógica pura de reescrita do CSV interno
  # (test_rebuild_table_logic.py), não o round-trip do bundle inteiro, que segue com pytest.skip.
  connector-bof4:
    name: Connector contract — BoF4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Connector contract — BoF4
        run: python -m pytest projects/breath_of_fire_4/connector/ -v --tb=short

  connector-uta:
    name: Connector contract — Utawarerumono
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Connector contract — Utawarerumono
        run: python -m pytest projects/utawarerumono/connector/ -v --tb=short

  connector-souldiers:
    name: Connector contract — Souldiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Connector contract — Souldiers
        run: python -m pytest projects/souldiers/connector/ -v --tb=short

  connector-skeleton:
    name: Connector skeleton contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Connector skeleton contract
        run: python -m pytest framework/connectors/_skeleton/ -v --tb=short

  # framework/connectors/*.py (connector_io.py, discover.py, tier_classifier.py, evidence_collector.py,
  # script_generator.py, coverage_gate.py, adversarial_validator.py, connector_smoke.py e seus testes)
  # nunca era coletado por nenhum job -- nem aqui nem no `coverage` (que só varre runtime/db/skills/
  # validation). Achado em code review (2026-07-04): uma regressão em connector_io.resolve_source_path
  # (usado por BoF4/Souldiers/Utawarerumono extract.py via #86) passaria verde e só apareceria rodando
  # contra o jogo real. #92: piso PARCIAL de 75% (não 90% como o job `coverage`) -- connector_io.py,
  # tier_classifier.py, script_generator.py, coverage_gate.py, evidence_collector.py e
  # adversarial_validator.py já estão em 98-100%; discover.py (23%) e connector_smoke.py (61%) são
  # módulos exploratórios que ainda puxam a média pra baixo (issue de continuação p/ fechar 90% neles).
  connector-io:
    name: Connector shared utilities (framework/connectors/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Connector shared utilities (coverage 75%)
        run: |
          python -m pytest framework/connectors/ --ignore=framework/connectors/_skeleton \
            -v --tb=short --cov=framework/connectors --cov-report=term-missing --cov-fail-under=75

  # Gate de aprovação manual antes do merge em main. "Require pull request reviews" do GitHub
  # bloqueia o autor de aprovar a própria PR — inviável pra dev solo. Reaproveita o mesmo
  # mecanismo de environment protection do sync-prd.yml (permite auto-aprovação, mas fica
  # registrado quem/quando). needs: encadeia os jobs deste arquivo — se algum falhar, o gate
  # nunca fica disponível pra aprovar. Só roda em PR (não em push direto pra main).
  merge-gate:
    name: Merge gate — aprovação manual
    if: github.event_name == 'pull_request'
    needs: [env-guard, mypy, coverage, connector-bof4, connector-uta, connector-souldiers, connector-skeleton, connector-io]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Merge aprovado manualmente."
