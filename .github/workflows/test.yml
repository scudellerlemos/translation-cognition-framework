name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # S5: .env nunca deve ser rastreado pelo git
      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERRO: .env rastreado — remova com: git rm --cached .env"
            exit 1
          fi
          echo "OK: .env não rastreado"

      - name: Type-check (mypy)
        run: mypy framework/runtime/config.py framework/runtime/paths.py framework/runtime/cost.py framework/runtime/context_pack.py framework/runtime/state_index.py

      # E3: coverage mínima (baseline; subir gradualmente)
      - name: Run runtime tests with coverage
        run: |
          python -m pytest framework/runtime/test_runtime.py -v --tb=short \
            --cov=framework/runtime --cov-report=term-missing --cov-fail-under=60

      - name: Run validation tests
        run: python -m pytest framework/validation/ -v --tb=short

      # Testes de contrato do conector (round-trip byte-idêntico = oráculo).
      # Passos SEPARADOS por projeto: test_roundtrip.py tem basename repetido entre
      # bof4/uta e colidiria numa coleta única. Sem o binário do jogo (gitignored),
      # os testes que o exigem fazem pytest.skip; codec/schema/governança rodam.
      - name: Connector contract — BoF4
        run: python -m pytest projects/breath_of_fire_4/connector/ -v --tb=short
      - name: Connector contract — Utawarerumono
        run: python -m pytest projects/utawarerumono/connector/ -v --tb=short
      - name: Connector skeleton contract
        run: python -m pytest framework/connectors/_skeleton/ -v --tb=short
