name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Type-check (mypy)
        run: mypy framework/runtime/config.py framework/runtime/paths.py framework/runtime/cost.py

      - name: Run tests
        run: python -m pytest framework/runtime/test_runtime.py -v --tb=short
