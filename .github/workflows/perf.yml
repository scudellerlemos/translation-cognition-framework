# Performance — tendencia (nao bloqueia). Roda perf_bench.py (append_line, build_pack, state_index_tm) com
# baseline em framework/runtime/perf_baseline.json; regressao de mais de 2x vira ::warning:: na run e o JSON
# fica como artefato para acompanhar a tendencia. De proposito FORA do agregador `All checks`: tempo de CI e
# ruidoso, e bloquear PR por ruido treina o time a ignorar o aviso. O teste que falha de verdade esta em
# framework/runtime/test_perf_bench.py (baseline cobre toda operacao; deteccao de regressao).
name: Performance

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (tendencia, nao bloqueia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Medir
        run: python framework/runtime/perf_bench.py --out perf.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-${{ github.sha }}
          path: perf.json
