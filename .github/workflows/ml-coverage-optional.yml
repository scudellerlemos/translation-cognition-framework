# Cobertura real (ML) — job dedicado, fora do push/PR (#181). embedder.py/validate_model.py só
# eram exercitados por testes que usam pytest.importorskip("sentence_transformers"/"sqlite_vec")
# e ficam pulados sem essa stack — o que é o caso de test.yml (nunca a instala, ver
# requirements-ml.txt) e, até aqui, deste job. Resultado: nenhum gate automatizado verificava
# Embedder.index_project/search/search_kb/search_decisions ou validate_model.py de verdade; uma
# regressão nessa lógica (ex.: inverter a métrica de distância) passava pela suíte inteira.
#
# Mesma stack pesada (~700MB-1,5GB, torch+modelo via HuggingFace) que já levou o audit de CVE
# (dep-audit-optional.yml, #89) pra cadência semanal em vez de todo push/PR — reaproveita o
# mesmo raciocínio de custo aqui. Upgrade natural se uma regressão passar batido entre domingos:
# mover pra test.yml (push/pull_request) e aceitar o tempo extra por PR.
name: Cobertura real (ML) — embedder/validate_model

on:
  workflow_dispatch:   # disparo manual
  schedule:
    - cron: '30 5 * * 0'   # domingo 05:30 UTC (30min depois do audit de CVE opcional)

jobs:
  ml-coverage:
    name: Coverage real — embedder.py / validate_model.py (piso 85%)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ml.txt
      - name: Install dependencies (dev + ml)
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-ml.txt
      - name: Testes reais (sem importorskip) + coleta de coverage
        # --cov=framework/db mede o pacote inteiro em .coverage; o gate específico dos dois
        # módulos (setup.cfg omite embedder.py do piso de 90% do job `coverage`, ver comentário
        # lá) fica isolado no passo seguinte via --include, com .coveragerc-ml (sem esse omit).
        run: |
          python -m pytest framework/db/test_validate_model.py framework/db/test_embedder_kind_config.py \
            framework/db/test_embedder_min_score.py framework/runtime/test_context_pack.py \
            framework/runtime/test_kb_concordance.py \
            -v --tb=short --cov-config=.coveragerc-ml --cov=framework/db --cov-report=
      - name: Gate de cobertura real — embedder.py + validate_model.py (piso 85%)
        run: |
          python -m coverage report --rcfile=.coveragerc-ml \
            --include="framework/db/embedder.py,framework/db/validate_model.py" \
            --fail-under=85 -m

      # Cron falho passa batido se ninguém abrir a aba Actions. Mesmo padrão do
      # dep-audit-optional.yml/api-smoke.yml: abre (ou comenta numa já aberta) uma issue.
      - name: Notifica falha (abre/atualiza issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="CI agendada falhou: ${{ github.workflow }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --search "in:title \"$title\"" --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Falhou de novo: $run_url"
          else
            gh issue create --title "$title" --body "Run: $run_url"
          fi
