# Quality — gates de qualidade e segurança em cada push/PR (4 jobs paralelos).
# Adapta o padrão cicd-padrao-databricks sem a camada Databricks/deploy.
#   lint   : estilo e bugs no código       sast   : vulnerabilidades de código
#   secrets: credenciais vazadas           deps   : CVEs nas dependências
name: Quality

on:
  # push em "**" + pull_request em "**" duplicava a suite inteira em toda branch com PR aberta
  # (um run por evento, mesmo commit e mesmos 4 contexts na branch protection) - mesmo caso do
  # test.yml (ver commit "ci: remove duplicacao de test.yml..."). push fica só em main (onde faz
  # sentido rodar sem PR); pull_request cobre toda branch via PR.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  # LINT — ruff (regras F/I/UP/B) no produto reusável framework/: imports/variáveis
  # mortos, bugs do bugbear e ordenação de imports. Scripts one-off de projects/*/connector
  # ficam no pre-commit local (já barrados pelos testes de round-trip), não na CI.
  lint:
    name: Lint (ruff) — estilo e bugs no framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check framework

  # SAST — bandit varre framework/ e projects/*/connector/ em busca de padrões inseguros (eval,
  # subprocess shell, hash fraco, etc.). Connector = maior superfície de risco (parsing de binário
  # de jogo não confiável) — round-trip testa fidelidade de bytes, não padrões inseguros de código;
  # as duas checagens são ortogonais. Falha só em MEDIUM+; LOW (ex.: try/except/pass) fica como aviso.
  sast:
    name: SAST (bandit) — vulnerabilidades de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Bandit (SAST)
        run: bandit -r framework projects -c pyproject.toml --severity-level medium

  # SECRETS — gitleaks procura credenciais/chaves vazadas no diff e no histórico.
  # Conta pessoal: gratuito. Organização exige o secret GITLEAKS_LICENSE.
  secrets:
    name: Secret scan (gitleaks) — credenciais vazadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico completo para o scan varrer o range do push/PR
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # DEPS — pip-audit confere as dependências contra CVEs conhecidos (supply-chain). Falha se
  # houver vulnerabilidade reportada sem fix aplicado. #89: os 3 requirements-*.txt (dev/kb/ml),
  # não só o de dev — requirements-kb.txt (pdfplumber/python-docx) e requirements-ml.txt
  # (sentence-transformers/sqlite-vec/flashrank/torch) ficavam sem auditoria. Steps SEPARADOS:
  # cada requirements-*.txt é uma stack opcional independente (kb/ml não são pré-requisito um do
  # outro nem do dev) — uma falha não deve mascarar a auditoria das outras duas.
  deps:
    name: Dependências (pip-audit) — CVEs conhecidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-kb.txt
            requirements-ml.txt
      - name: Install dependencies (dev)
        run: pip install -r requirements-dev.txt
      - name: pip-audit — requirements-dev.txt (CVEs)
        run: pip-audit -r requirements-dev.txt
      - name: Install dependencies (kb)
        run: pip install -r requirements-kb.txt
      - name: pip-audit — requirements-kb.txt (CVEs)
        run: pip-audit -r requirements-kb.txt
      - name: Install dependencies (ml)
        run: pip install -r requirements-ml.txt
      - name: pip-audit — requirements-ml.txt (CVEs)
        run: pip-audit -r requirements-ml.txt
