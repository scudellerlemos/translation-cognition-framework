# API Smoke — verificação opcional de que a Batch API da Anthropic ainda responde como
# esperado (detecta breaking changes no SDK/endpoint antes de iniciar um capítulo novo).
# NÃO roda em push: só no cron semanal e por disparo manual, porque faz uma chamada de
# rede real (~$0.002) e depende do secret ANTHROPIC_API_KEY.
name: API Smoke

on:
  workflow_dispatch:   # disparo manual (antes de iniciar tradução de capítulo novo)
  schedule:
    - cron: '0 4 * * 0'   # domingo 04:00 UTC — detecta breaking changes na Batch API

jobs:
  # SMOKE — instala deps, checa se a key existe e (se existir) roda o smoke da Batch API.
  # Sem o secret ANTHROPIC_API_KEY o smoke é PULADO (run verde), não falha.
  smoke:
    name: Smoke da Batch API (~$0.002; pula sem a key)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Sem o secret, o smoke é PULADO (run verde) em vez de falhar — o teste é opcional
      # (custa ~$0.002 e depende de billing). Para ativá-lo: adicione ANTHROPIC_API_KEY em
      # Settings > Secrets and variables > Actions.
      - name: Check API key present
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY não configurada — pulando o smoke (adicione em Settings > Secrets > Actions)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Batch API smoke (~$0.002)
        if: steps.key.outputs.present == 'true'
        run: python framework/runtime/batch_smoke.py

      # Cron falho passa batido se ninguém abrir a aba Actions. Abre (ou comenta numa já
      # aberta) uma issue em vez de silenciar — sem secret novo, usa o token padrão do job.
      - name: Notifica falha (abre/atualiza issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="CI agendada falhou: ${{ github.workflow }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --search "in:title \"$title\"" --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Falhou de novo: $run_url"
          else
            gh issue create --title "$title" --body "Run: $run_url"
          fi
