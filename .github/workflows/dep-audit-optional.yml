# Dependências opcionais (kb/ml) — pip-audit fora do push/PR. requirements-kb.txt e
# requirements-ml.txt são stacks OPCIONAIS (nunca instaladas em test.yml/quality.yml no dia a dia):
# instalar torch+sentence-transformers (~700MB-1,5GB) do zero a cada push/PR custava ~1min do
# total de ~2min20s do job `deps` de quality.yml pra auditar código que a maioria das mudanças nem
# toca. CVE-check semanal é suficiente pra uma stack que não entra no caminho determinístico.
name: Dependências opcionais (kb/ml)

on:
  workflow_dispatch:   # disparo manual
  schedule:
    - cron: '0 5 * * 0'   # domingo 05:00 UTC

jobs:
  deps-optional:
    name: Dependências (pip-audit) — kb/ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-kb.txt
            requirements-ml.txt
      - name: Install dependencies (kb)
        run: pip install -r requirements-kb.txt
      - name: pip-audit — requirements-kb.txt (CVEs)
        run: pip-audit -r requirements-kb.txt
      - name: Install dependencies (ml)
        run: pip install -r requirements-ml.txt
      - name: pip-audit — requirements-ml.txt (CVEs)
        run: pip-audit -r requirements-ml.txt
      - name: Congela versões exatas resolvidas (kb+ml)
        run: pip freeze > /tmp/pip-freeze-kb-ml.txt
      - name: Sobe pip-freeze como artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-freeze-kb-ml-${{ github.sha }}
          path: /tmp/pip-freeze-kb-ml.txt
          retention-days: 90

      # Cron falho passa batido se ninguém abrir a aba Actions. Abre (ou comenta numa já
      # aberta) uma issue em vez de silenciar — mesmo padrão do api-smoke.yml.
      - name: Notifica falha (abre/atualiza issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="CI agendada falhou: ${{ github.workflow }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --search "in:title \"$title\"" --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Falhou de novo: $run_url"
          else
            gh issue create --title "$title" --body "Run: $run_url"
          fi
