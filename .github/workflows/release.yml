# Release imutável do framework, disparada por tag (git tag vX.Y.Z && git push --tags).
# validate-release: oráculo objetivo (VERSION bate com a tag) — sem environment, automático.
# publish-release: gated por environment Production (aprovação manual — aqui sim faz sentido:
# evento raro e deliberado, não um clique repetido em todo merge). Notas da release são geradas
# pelo próprio GitHub (lista de PRs desde a última tag) — não dependem do formato do
# CHANGELOG.md (que é cronológico, sem número de versão, por decisão própria). Os textos fixos
# que o GitHub gera em inglês ("What's Changed", "Full Changelog" etc.) são traduzidos pra pt-BR
# antes de publicar — todo o resto do projeto (commits, docs, ADRs) já é em português.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  validate-release:
    name: Valida VERSION == tag e testes verdes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # gh run list (gate de testes abaixo)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confere VERSION == tag
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "ERRO: VERSION ($version) diverge da tag (v$tag). Atualize VERSION antes de taguear."
            exit 1
          fi
          echo "OK: VERSION == tag ($version)"
      # Tag nao dispara test.yml (so main/PR): exige um run verde dele NESTE commit, senao uma tag
      # em commit quebrado/nao testado publicaria release mesmo assim.
      - name: Confere Tests verde neste commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ok="$(gh run list --workflow=test.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$ok" -lt 1 ]; then
            echo "ERRO: nenhum run verde de test.yml em $GITHUB_SHA. Aguarde/conserte os testes antes de taguear."
            exit 1
          fi
          echo "OK: test.yml verde em $GITHUB_SHA"

  publish-release:
    name: Publica GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gera notas em pt-BR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > /tmp/release-notes.md
          sed -i \
            -e "s/## What's Changed/## O que mudou/" \
            -e "s/### New Contributors/### Novos contribuidores/" \
            -e "s/made their first contribution/fez sua primeira contribuição/g" \
            -e "s/ by @/ por @/g" \
            -e "s/ in http/ em http/g" \
            -e "s/\*\*Full Changelog\*\*/**Changelog completo**/" \
            /tmp/release-notes.md
      - name: Cria release neste repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
