# Release imutável do framework, disparada por tag (git tag vX.Y.Z && git push --tags).
# validate-release: oráculo objetivo (VERSION bate com a tag) — sem environment, automático.
# publish-release: gated por environment Production (aprovação manual — aqui sim faz sentido:
# evento raro e deliberado, não um clique repetido em todo merge). Notas da release são geradas
# pelo próprio GitHub (--generate-notes, lista de PRs desde a última tag) — não dependem do
# formato do CHANGELOG.md (que é cronológico, sem número de versão, por decisão própria).
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  validate-release:
    name: Valida VERSION == tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confere VERSION == tag
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "ERRO: VERSION ($version) diverge da tag (v$tag). Atualize VERSION antes de taguear."
            exit 1
          fi
          echo "OK: VERSION == tag ($version)"

  publish-release:
    name: Publica GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cria release neste repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
