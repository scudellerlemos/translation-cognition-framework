# CD — espelha um subconjunto curado deste repo (HML) para o repo PRD (público/oficial).
# Cada push em main gera um snapshot squashed: 1 commit novo no PRD com o estado atual,
# nunca o histórico do HML (que já passou por dado sensível antes da purga da PR #139).
# `publish` fica atrás de approval gate: Settings -> Environments -> production
# (required reviewers + secrets PRD_REPO_TOKEN / PRD_REPO só visíveis ali).
name: Sync to PRD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-snapshot:
    name: Build curated snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Assemble allowlisted files
        run: |
          set -e
          mkdir -p snapshot/.github/workflows
          cp -r framework snapshot/
          # projects/*/connector: só código de engenharia reversa + metadados, nunca
          # artifacts/output/profile (dado de jogo/cliente). translation_local/translation_software
          # ficam HML-only de propósito (POC sem conector, fora do escopo do portfólio publicado).
          for proj in projects/*/; do
            name=$(basename "$proj")
            if [ -d "${proj}connector" ]; then
              mkdir -p "snapshot/projects/${name}"
              cp -r "${proj}connector" "snapshot/projects/${name}/"
              [ -f "${proj}project.json" ] && cp "${proj}project.json" "snapshot/projects/${name}/"
              [ -f "${proj}README.md" ] && cp "${proj}README.md" "snapshot/projects/${name}/"
              [ -f "${proj}ROADMAP.md" ] && cp "${proj}ROADMAP.md" "snapshot/projects/${name}/"
              [ -f "${proj}ROADMAP_history.md" ] && cp "${proj}ROADMAP_history.md" "snapshot/projects/${name}/"
            fi
          done
          cp README.md CHANGELOG.md ROADMAP.md VERSION pyproject.toml setup.cfg mypy.ini \
             .pre-commit-config.yaml .gitattributes .gitignore snapshot/
          cp requirements-dev.txt requirements-ml.txt requirements-kb.txt snapshot/
          cp .github/workflows/test.yml .github/workflows/quality.yml \
             .github/workflows/api-smoke.yml snapshot/.github/workflows/
          cp .github/dependabot.yml snapshot/.github/
      - name: Verificar que a allowlist cobre tudo (drift check)
        # Achado de revisão: arquivo novo fora da allowlist sumia do PRD em silêncio (nem builda,
        # nem avisa). Fecha o buraco: todo arquivo rastreado no HML tem que casar com `allow`
        # (vai pro PRD) OU `deny` (fica HML-only de propósito, listado aqui). Sobrou algo que não
        # bate com nenhum dos dois -> falha o job e lista os paths, forçando classificação explícita.
        run: |
          set -e
          allow=(
            'framework/*'
            'projects/breath_of_fire_4/connector/*'
            'projects/breath_of_fire_4/project.json'
            'projects/breath_of_fire_4/README.md'
            'projects/breath_of_fire_4/ROADMAP.md'
            'projects/souldiers/connector/*'
            'projects/souldiers/project.json'
            'projects/souldiers/README.md'
            'projects/trails_sky_sc/connector/*'
            'projects/trails_sky_sc/project.json'
            'projects/trails_sky_sc/README.md'
            'projects/utawarerumono/connector/*'
            'projects/utawarerumono/project.json'
            'projects/utawarerumono/README.md'
            'projects/utawarerumono/ROADMAP_history.md'
            'README.md'
            'CHANGELOG.md'
            'ROADMAP.md'
            'VERSION'
            'pyproject.toml'
            'setup.cfg'
            'mypy.ini'
            '.pre-commit-config.yaml'
            '.gitattributes'
            '.gitignore'
            'requirements-dev.txt'
            'requirements-ml.txt'
            'requirements-kb.txt'
            '.github/workflows/test.yml'
            '.github/workflows/quality.yml'
            '.github/workflows/api-smoke.yml'
            '.github/dependabot.yml'
          )
          deny=(
            '.claude/*'
            'CLAUDE.md'
            '.env.example'
            '.github/workflows/sync-prd.yml'
            '.github/workflows/README.md'
            'projects/breath_of_fire_4/artifacts/*'
            'projects/breath_of_fire_4/output/*'
            'projects/breath_of_fire_4/profile/*'
            'projects/breath_of_fire_4/.env.example'
            'projects/souldiers/artifacts/*'
            'projects/souldiers/output/*'
            'projects/souldiers/profile/*'
            'projects/trails_sky_sc/artifacts/*'
            'projects/trails_sky_sc/output/*'
            'projects/trails_sky_sc/profile/*'
            'projects/utawarerumono/artifacts/*'
            'projects/utawarerumono/output/*'
            'projects/utawarerumono/profile/*'
            'projects/translation_local/*'
            'projects/translation_software/*'
          )
          unclassified=()
          while IFS= read -r f; do
            matched=0
            for p in "${allow[@]}" "${deny[@]}"; do
              case "$f" in
                $p) matched=1; break ;;
              esac
            done
            [ "$matched" = 0 ] && unclassified+=("$f")
          done < <(git ls-files)
          if [ "${#unclassified[@]}" -gt 0 ]; then
            echo "ERRO: arquivo(s) rastreado(s) no HML sem classificacao na allowlist/denylist deste workflow:"
            printf '  %s\n' "${unclassified[@]}"
            echo "Classifique cada um: adicione ao array 'allow' (vai pro PRD) ou 'deny' (fica HML-only)."
            exit 1
          fi
          echo "OK: todo arquivo rastreado esta classificado (allow ou deny)."
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prd-snapshot
          path: snapshot/

  publish:
    name: Publish to PRD (gated)
    needs: build-snapshot
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Download snapshot artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prd-snapshot
          path: snapshot
      - name: Push snapshot to PRD repo
        env:
          PRD_REPO_TOKEN: ${{ secrets.PRD_REPO_TOKEN }}
          PRD_REPO: ${{ vars.PRD_REPO }} # ex: usuario/nome-do-repo-prd
        run: |
          set -e
          git clone "https://x-access-token:${PRD_REPO_TOKEN}@github.com/${PRD_REPO}.git" prd
          rsync -a --delete --exclude='.git' snapshot/ prd/
          cd prd
          git config user.name "sync-prd-bot"
          git config user.email "sync-prd-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou — sem commit novo no PRD."
          else
            git commit -m "sync: publica snapshot de HML@${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi
