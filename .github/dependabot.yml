version: 2
updates:
  # Dependências Python — o ecossistema pip do Dependabot descobre por convenção de nome
  # (requirements.txt, requirements-*.txt, pyproject.toml) dentro de `directory`, então já
  # cobre os 3 arquivos na raiz sem entrada separada: requirements-dev.txt, requirements-kb.txt
  # e requirements-ml.txt (#89 — confirmado: cada um vira PR de update independente).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Versões das GitHub Actions usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
