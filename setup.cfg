[tool:pytest]
testpaths = framework/runtime framework/validation
python_files = test_*.py
addopts = --tb=short

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = False

[coverage:run]
source = framework/runtime
omit = */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.
    raise NotImplementedError
