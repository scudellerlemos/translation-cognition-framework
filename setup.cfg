[tool:pytest]
testpaths = framework/runtime framework/validation
python_files = test_*.py
addopts = --tb=short

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = False

[coverage:run]
source = framework/runtime
# Fora do denominador: os testes; scripts de benchmark/dev; clientes de rede (não-unitáveis
# sem socket vivo — o backend local foi aposentado). Medir cobertura nesses seria gaming.
omit =
    */test_*.py
    */conftest.py
    */bench_local.py
    */bench_translate.py
    */batch_smoke.py
    */ollama_client.py
    */llm_client.py

[coverage:report]
# Linhas não-testáveis por natureza: guard de __main__, dispatchers CLI (argparse),
# blocos só-de-tipo, stubs. Padrão de mercado — não infla nem mascara lógica.
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.
    def main\(
    if TYPE_CHECKING:
    raise NotImplementedError
