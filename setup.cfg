[tool:pytest]
testpaths = framework/runtime framework/validation
python_files = test_*.py
addopts = --tb=short

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = False

[coverage:run]
# Mede a APLICACAO inteira (runtime + db + skills + cli + validation), nao so o runtime.
source = framework
# Fora do denominador: os testes; scripts de benchmark/dev; e o stack de ML/rede (nao-unitavel
# sem servidor/deps vivos — embedder=sentence-transformers, ollama/llm=SDK/socket). Medir
# cobertura nesses seria gaming; eles tem seu proprio caminho de validacao (deps fora da CI).
omit =
    */test_*.py
    */conftest.py
    */bench_local.py
    */bench_translate.py
    */batch_smoke.py
    */llm_client.py
    */embedder.py

[coverage:report]
# precision=2: SEM isso, coverage.py compara --cov-fail-under contra o total ARREDONDADO
# pro inteiro mais próximo (ex.: 89,97% exibe/compara como "90%" e PASSA um piso de 90) --
# achado real rodando o comando exato do CI: total 89,97% imprimia "FAIL ... 89.97%" e ainda
# assim saia com exit code 0. precision=2 forca a comparacao pelo valor preciso.
precision = 2
# Linhas não-testáveis por natureza: guard de __main__, dispatchers CLI (argparse),
# blocos só-de-tipo, stubs. Padrão de mercado — não infla nem mascara lógica.
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.
    def main\(
    if TYPE_CHECKING:
    raise NotImplementedError
