    framework/db/export_to_flat.py,
    framework/runtime/model.py,
    framework/runtime/run_scene.py,
    framework/runtime/run_chapter.py,
    framework/runtime/run_game.py,
    framework/runtime/back_translate.py,
    framework/runtime/llm_client.py,
    framework/skills/registry.py,
    framework/skills/s00_extraction.py,
    framework/skills/s06_translation.py,
