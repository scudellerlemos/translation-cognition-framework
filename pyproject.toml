[project]
name = "translation-cognition-framework"
version = "1.0.0"
description = "Harness determinístico de localização de jogos baseado em cognição narrativa (SDD)"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openpyxl>=3.1",
    "mypy>=1.0",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
