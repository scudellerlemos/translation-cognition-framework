[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Curado: bugs reais (F/B) + import-sort (I) + modernização (UP).
# Grupo E (pycodestyle/estilo) e o formatter ficam só no pre-commit, não na CI.
select = ["F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["B011"]
# Template de conector: variáveis de scaffolding (tabelas a preencher ao copiar) são intencionais.
"**/_skeleton/**" = ["F841"]

[tool.bandit]
# B101: assert é idiomático nos testes de contrato/round-trip deste repo.
skips = ["B101"]
# Config de cobertura vive no setup.cfg ([coverage:*]) — coverage.py lê o setup.cfg primeiro.
